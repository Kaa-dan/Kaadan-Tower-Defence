name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The fast loop. Simulation and tests only -- KTD_TESTS_ONLY skips engine/ and
  # app/, so SDL is never fetched or compiled. Seconds, not minutes.
  core:
    name: core (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        preset: [core, core-release]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The full build, including SDL and the GL backend. Release only: this exists
  # to catch link and platform breakage, not to gate every push on a slow build.
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
                                  libxi-dev libxfixes-dev libxrender-dev libxss-dev \
                                  libxtst-dev libwayland-dev libxkbcommon-dev \
                                  libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev
      - name: Cache SDL source and build
        uses: actions/cache@v4
        with:
          # Keyed on the pinned SDL commit, so the cache invalidates exactly when
          # the pin moves and never otherwise.
          path: build/release/_deps
          key: sdl-${{ runner.os }}-147a8ee32dbf9ac02f3794964490687b6bbda1bc
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release

  # The job that actually proves determinism.
  #
  # Everything else in this phase is scaffolding for these two: each platform
  # produces a per-tick hash trace of the same scripted run, and the compare job
  # diffs them. Without this, the float-with-discipline decision in ADR 0002 is
  # a hope rather than a property -- nothing else here can observe two operating
  # systems at once.
  #
  # Both build types run, because FMA contraction usually breaks Debug against
  # Release before it breaks one OS against another.
  determinism:
    name: determinism trace (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        preset: [core, core-release]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build hash dump
        run: cmake --build --preset ${{ matrix.preset }} --target ktd_hashdump
      - name: Produce trace
        shell: bash
        run: |
          # Ninja is single-config on every platform here, MSVC included, so
          # there is no per-config subdirectory. The .exe suffix is spelled out
          # rather than left to Git Bash's implicit resolution.
          BIN="build/${{ matrix.preset }}/tests/ktd_hashdump"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi

          # The status is captured rather than left to `set -e`, because a bare
          # crash here reports "exit code 139" and nothing else -- not how far
          # the run got, which is the one fact that says whether it died loading
          # content or on the last tick.
          set +e
          "$BIN" > trace.tsv
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::ktd_hashdump exited $status after $(wc -l < trace.tsv) of 3000 lines"
            # TEMPORARY: name the faulting frame on the one platform that cannot
            # be reproduced locally. Remove once the Windows release crash is fixed.
            GDB=$(command -v gdb || echo /c/mingw64/bin/gdb)
            if [ -x "$GDB" ]; then
              # A command file, not -ex: Git Bash splits a quoted multi-word
              # -ex argument, and the stray word is then taken as the program.
              printf 'set pagination off\nrun\nbt full\ninfo sharedlibrary\n' > gdb.cmds
              "$GDB" -batch -x gdb.cmds "$BIN" > gdb.log 2>&1 || true
              echo "--- gdb ---"
              head -n 120 gdb.log
            else
              echo "no gdb on this runner"
            fi
            exit 1
          fi
          # A truncated trace would still diff clean against another truncated
          # trace, so assert the length rather than trusting it.
          test "$(wc -l < trace.tsv)" -eq 3000
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.os }}-${{ matrix.preset }}
          path: trace.tsv
          if-no-files-found: error

  determinism-compare:
    name: determinism compare
    runs-on: ubuntu-latest
    needs: determinism
    steps:
      - uses: actions/checkout@v4
      - name: Download traces
        uses: actions/download-artifact@v4
        with:
          pattern: trace-*
          path: traces
      - name: Compare across platforms and build types
        run: |
          python3 tests/tools/compare_traces.py \
            ubuntu-debug=traces/trace-ubuntu-latest-core/trace.tsv \
            ubuntu-release=traces/trace-ubuntu-latest-core-release/trace.tsv \
            macos-debug=traces/trace-macos-14-core/trace.tsv \
            macos-release=traces/trace-macos-14-core-release/trace.tsv \
            windows-debug=traces/trace-windows-latest-core/trace.tsv \
            windows-release=traces/trace-windows-latest-core-release/trace.tsv
      - name: Confirm the traces match the committed reference
        run: |
          # The committed reference is what determinism_golden pins, so if CI
          # agrees with itself but not with the repo, the golden constant is
          # stale and every replay recorded against it is suspect.
          diff -u tests/data/reference_trace.tsv traces/trace-ubuntu-latest-core/trace.tsv

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not the runner's default: clang-format's output changes between
      # major versions, so an unpinned binary means a runner image bump can turn
      # CI red with no code change. Keep this in lockstep with CLAUDE.md.
      - name: Install clang-format
        run: |
          pipx install clang-format==20.1.7
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: |
          find game engine app tests \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror
